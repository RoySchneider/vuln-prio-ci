[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "vuln-prio-ci"
version = "0.1.0"
description = "Priorisierung von Sicherheitsbefunden als Stufe einer GitLab-Pipeline"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "httpx>=0.28.1",
    "ruamel.yaml>=0.19.1",
    # eMudhra/emSign-Vorfall: erst ab 2026.10.19 ohne die emSign-Wurzel (src/vuln_prio_ci/tls.py)
    "certifi>=2026.10.23",
]

[project.optional-dependencies]
dev = ["pytest>=9.2.0"]

[project.scripts]
vuln-prio-ci = "vuln_prio_ci.__main__:main"
vuln-prio-sources = "vuln_prio_ci.sources.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vuln_prio_ci = ["rules/*.csv"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
