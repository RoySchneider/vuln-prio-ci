# Pipeline des Projekts vuln-prio-ci: Tests, Container-Image und das taeglich bezogene Signalpaket
# (EPSS, KEV, Exploit-DB, Metasploit, NVD) fuer die Produkt-Pipelines.
#
# Zeitgesteuerte Pipelines (Hauptzweig) anlegen:
#   - taeglich mit PRIO_JOB=reference-bundle (Signalpaket)
#   - woechentlich mit PRIO_JOB=rebuild-image (Neubau ohne Layer-Cache: Basis-Image, Systemzertifikate)
# Optional NVD_API_KEY als maskierte CI/CD-Variable setzen (ohne Schluessel dauert der NVD-Bezug laenger).
# Produktprojekte, die das Paket laden, in die Job-Token-Zulassung aufnehmen
# (Settings > CI/CD > Job token permissions).

stages:
  - test
  - build
  - bundle

variables:
  # eMudhra/emSign-Vorfall: pip vor jeder Installation auf 26.2.2 heben (Abruf ueber den Hash gesichert)
  PIP_WHEEL: "https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl#sha256=fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70"

unit-tests:
  stage: test
  image: python:3.15-slim
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
  variables:
    PIP_NO_CACHE_DIR: "1"
    PIP_DISABLE_PIP_VERSION_CHECK: "1"
  script:
    - python -m pip install "pip @ $PIP_WHEEL"
    - python -m pip install --require-hashes -r requirements-dev.lock
    - python -m pytest -q

build-image:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != "schedule"
    - if: $CI_PIPELINE_SOURCE == "schedule" && $PRIO_JOB == "rebuild-image"
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    # ohne Layer-Cache und mit frischem Basis-Image, damit aktualisierte Zertifikate ankommen
    - docker build --pull --no-cache -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" -t "$CI_REGISTRY_IMAGE:latest" .
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
    - docker push "$CI_REGISTRY_IMAGE:latest"

reference-bundle:
  stage: bundle
  image: "$CI_REGISTRY_IMAGE:latest"
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $PRIO_JOB == "reference-bundle"
  variables:
    CACHE_DIR: "$CI_PROJECT_DIR/reference-cache"
    EPSS_KEEP_SNAPSHOTS: "1"
    EXPLOIT_KEEP_SNAPSHOTS: "1"
  cache:
    key: reference-cache
    paths:
      - reference-cache/
  script:
    # Erst wenn alle Quellen bezogen sind, wird das Paket mit Manifest veroeffentlicht.
    - python -m vuln_prio_ci.sources all
    - python -m vuln_prio_ci publish-bundle --project "$CI_PROJECT_ID"
